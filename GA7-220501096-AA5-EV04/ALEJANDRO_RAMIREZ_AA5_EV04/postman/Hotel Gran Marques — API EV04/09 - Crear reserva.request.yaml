$kind: http-request
description: 09 - Crear reserva
url: "{{baseUrl}}/api/reservations"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "guestId": "{{guestId}}",
      "roomId": "{{roomId}}",
      "checkIn": "{{checkIn}}",
      "checkOut": "{{checkOut}}",
      "guestsCount": 1,
      "notes": "Reserva para probar la API EV03"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201 esperado', function () { pm.response.to.have.status(201); });
      const j=pm.response.json(); pm.collectionVariables.set('reservationId',j.data.reservation.id); pm.test('Reserva de dos noches',()=>pm.expect(j.data.reservation.nights).to.eql(2));
    language: text/javascript
order: 10000
