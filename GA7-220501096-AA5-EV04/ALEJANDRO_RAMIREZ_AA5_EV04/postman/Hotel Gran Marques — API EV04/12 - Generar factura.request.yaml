$kind: http-request
description: 12 - Generar factura
url: "{{baseUrl}}/api/invoices"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reservationId": "{{reservationId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201 esperado', function () { pm.response.to.have.status(201); });
      const j=pm.response.json(); pm.collectionVariables.set('invoiceId',j.data.invoice.id); pm.test('Factura con total positivo',()=>pm.expect(j.data.invoice.total).to.be.above(0));
    language: text/javascript
order: 13000
