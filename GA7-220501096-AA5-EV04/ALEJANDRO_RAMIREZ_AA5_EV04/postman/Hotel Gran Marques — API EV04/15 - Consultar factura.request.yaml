$kind: http-request
description: 15 - Consultar factura
url: "{{baseUrl}}/api/invoices/{{invoiceId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200 esperado', function () { pm.response.to.have.status(200); });
      const j=pm.response.json(); pm.test('Factura tiene pagos',()=>pm.expect(j.data.invoice.payments.length).to.be.above(0));
    language: text/javascript
order: 16000
