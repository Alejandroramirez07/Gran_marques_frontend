$kind: http-request
description: 11 - Agregar servicio a la reserva
url: "{{baseUrl}}/api/reservations/{{reservationId}}/services"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "serviceId": "{{serviceId}}",
      "quantity": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201 esperado', function () { pm.response.to.have.status(201); });
      const j=pm.response.json(); pm.test('Consumo relacionado con reserva',()=>pm.expect(j.data.reservation.services.length).to.be.above(0));
    language: text/javascript
order: 12000
