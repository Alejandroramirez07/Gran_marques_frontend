$kind: http-request
description: 03 - Login de administración
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "admin",
      "password": "123456"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200 esperado', function () { pm.response.to.have.status(200); });
      const j=pm.response.json(); pm.collectionVariables.set('token',j.data.token); pm.test('Token Bearer recibido',()=>pm.expect(j.data.token).to.be.a('string'));
    language: text/javascript
order: 4000
