$kind: http-request
description: 20 - Login de recepción
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "recepcion",
      "password": "123456"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200 esperado', function () { pm.response.to.have.status(200); });
      const j=pm.response.json(); pm.collectionVariables.set('tokenReception',j.data.token);
    language: text/javascript
order: 21000
